name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
    uses: okamyuji/reusable-workflows/.github/workflows/go-ci.yml@v1
    with:
      # The store tests run against a PostgreSQL image with pgvector and pg_bigm built from testdata/pg.
      test-command: "make pg-image && go test -count=1 ./..."
  security:
    permissions:
      contents: read
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
